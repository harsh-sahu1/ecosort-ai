<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  
  <!-- Laptop Screen Lid -->
  <rect x="150" y="80" width="300" height="190" rx="10" fill="#475569" stroke="#64748b" stroke-width="4"/>
  <rect x="165" y="95" width="270" height="160" rx="4" fill="url(#screen)"/>
  
  <!-- Cracked Screen Lines -->
  <path d="M 280 95 L 310 160 L 260 210 L 330 255 M 310 160 L 390 140 M 310 160 L 350 190" stroke="#f87171" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Laptop Keyboard Base -->
  <path d="M 110 270 L 490 270 L 520 320 L 80 320 Z" fill="#334155" stroke="#475569" stroke-width="3"/>
  <rect x="250" y="295" width="100" height="20" rx="3" fill="#1e293b"/>
  
  <!-- Label badge -->
  <rect x="190" y="345" width="220" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="366" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Dell Inspiron • Cracked Screen</text>
</svg>
