<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tbg)"/>
  
  <!-- Tablet Body -->
  <rect x="170" y="60" width="260" height="280" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
  <rect x="185" y="75" width="230" height="250" rx="12" fill="#064e3b" fill-opacity="0.3"/>
  
  <!-- Screen content: Eco checkmark -->
  <circle cx="300" cy="180" r="45" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
  <path d="M 280 180 L 295 195 L 325 165" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="300" y="255" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Operational & Ready</text>
  
  <!-- Label badge -->
