      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pbg)"/>
  
  <!-- Phone Body -->
  <rect x="220" y="50" width="160" height="300" rx="24" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="230" y="65" width="140" height="270" rx="16" fill="#090d16"/>
  
  <!-- Front Camera notch -->
