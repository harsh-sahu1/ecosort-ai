<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="hazard" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#hazard)"/>
  
  <!-- Swollen Battery Pouch -->
  <!-- Bulging distorted rounded pouch -->
  <path d="M 210 120 C 160 180, 160 220, 210 280 C 260 310, 340 310, 390 280 C 440 220, 440 180, 390 120 C 340 90, 260 90, 210 120 Z" fill="#27272a" stroke="#ef4444" stroke-width="5"/>
  
  <!-- Warning stripes / hazard lines -->
  <path d="M 285 70 L 285 105 M 315 70 L 315 105" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Fire Warning symbol -->
  <circle cx="300" cy="200" r="35" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="212" fill="#f87171" font-family="sans-serif" font-size="36" text-anchor="middle">⚠️</text>
  
  <!-- Swollen label -->
  <rect x="160" y="340" width="280" height="34" rx="17" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="362" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SWOLLEN LITHIUM BATTERY • HAZARD</text>
</svg>
